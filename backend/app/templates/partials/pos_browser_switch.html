{% if pacasholl_libreado_enabled %}
<div id="native-pos" class="d-inline-flex align-items-center flex-wrap gap-2" data-user="{{ user.id }}" data-bodega="{{ pos_auto_bodega_id or '' }}">
  <label class="form-check form-switch mb-0 small" title="Preventa nueva → factura en efectivo C$ → POS. Requiere Firefox con impresión silenciosa configurada y Ventas abierta.">
    <input id="native-pos-enabled" class="form-check-input" type="checkbox" disabled aria-label="Facturar preventas e imprimir POS automáticamente después de 40 segundos">
    <span class="form-check-label fw-semibold">Auto POS · <span id="native-pos-time">40 s</span></span>
  </label>
  <span id="native-pos-status" class="badge text-bg-secondary" role="status" hidden></span>
  <span id="native-pos-last" class="small" hidden></span>
  <button id="native-pos-retry" class="btn btn-sm btn-outline-secondary" type="button" title="Revisar la Epson y reimprimir la misma factura" hidden><i class="bi bi-printer"></i></button>
</div>
<script src="/static/js/pos-browser.js?v=3" defer></script>
{% endif %}
