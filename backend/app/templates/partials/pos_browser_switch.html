{% if pacasholl_libreado_enabled %}
<div id="native-pos" class="d-inline-flex align-items-center flex-wrap gap-2" data-worker="{{ 1 if pos_worker else 0 }}" data-station="{{ pos_station_id or '' }}" data-user="{{ user.id }}" data-bodega="{{ pos_auto_bodega_id or '' }}">
  <label class="form-check form-switch mb-0 small" title="Preventa nueva → factura en efectivo C$ → POS. Requiere Firefox con impresión silenciosa. Abre la ventana de impresión para continuar al salir de Ventas.">
    <input id="native-pos-enabled" class="form-check-input" type="checkbox" disabled aria-label="Facturar preventas e imprimir POS automáticamente después de 15 segundos">
    <span class="form-check-label fw-semibold">Auto POS · <span id="native-pos-time">15 s</span></span>
  </label>
  {% if not pos_worker %}<button id="native-pos-console" class="btn btn-sm btn-outline-secondary" type="button">Abrir impresión</button>{% endif %}
  <span id="native-pos-status" class="badge text-bg-secondary" role="status" hidden></span>
  <span id="native-pos-last" class="small" hidden></span>
  <button id="native-pos-retry" class="btn btn-sm btn-outline-secondary" type="button" title="Revisar la Epson y reimprimir la misma factura" hidden><i class="bi bi-printer"></i></button>
</div>
<script src="/static/js/pos-browser.js?v=7" defer></script>
{% endif %}
