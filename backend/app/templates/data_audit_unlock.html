{% extends "base.html" %}
{% block content %}
<div id="layout" class="min-h-screen grid lg:grid-cols-[260px_1fr] bg-surface">
{% include "partials/sidebar.html" %}
<main class="main-content"><div class="container py-4">
<a href="/data" class="btn btn-outline-secondary mb-3">Volver a Datos</a>
<div class="card mx-auto" style="max-width:420px"><div class="card-body p-4">
<h1 class="h4">Audit</h1><p class="text-muted">Auditoría de consultas de Ventas en caliente.</p>
<form method="post" action="/data/audit/unlock">
<label for="audit-password" class="form-label">Contraseña de acceso</label>
<input id="audit-password" name="password" type="password" class="form-control" required maxlength="128" autocomplete="off" autofocus />
{% if error %}<p class="text-danger mt-2" role="alert">{{ error }}</p>{% endif %}
<button class="btn btn-primary w-100 mt-3" type="submit">Abrir Audit</button>
</form></div></div></div></main></div>
{% endblock %}
